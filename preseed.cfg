# ===================== 全局静默 =====================
debconf debconf/priority select critical
d-i debian-installer/quiet boolean true
d-i debian-installer/splash boolean false
d-i debian-installer/force_quiet boolean true

# 语言与时区自动配置
d-i debian-installer/language string zh_CN
d-i debian-installer/country string CN
d-i debian-installer/locale string zh_CN.UTF-8
d-i localechooser/supported-locales multiselect zh_CN.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Asia/Shanghai
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# 完全离线，双核心变量自动跳过【扫描额外介质】弹窗，自动选否
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select none
d-i netcfg/get_hostname string SSCLOUD-Debian12
d-i netcfg/get_domain string local
d-i apt-setup/use_mirror boolean false
d-i apt-setup/use_network boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/no_mirror boolean true
d-i apt-setup/security-updates boolean false
d-i apt-setup/disable-cdrom-unmount boolean true
d-i apt-setup/disable_cdrom_entries boolean true
# 官方真实控制弹窗的两个变量，缺一不可
d-i apt-setup/cdrom/scan_second boolean false
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false

# ===================== UEFI 弹窗自动确认（新增这一行，解决截图弹窗） =====================
d-i partman-efi/force_efi_install boolean true

# ===================== 核心：分区阶段自动遍历磁盘、筛选最小盘，同步给分区&GRUB =====================
d-i partman/early_command string \
ls /sys/block | grep -E '^(sd|hd|vd|nvme)' | while read dev; do \
size=$(cat /sys/block/$dev/size); \
echo "$size /dev/$dev"; \
done | sort -n | head -1 | awk '{print $2}' > /tmp/target_disk; \
TARGET_DISK=$(cat /tmp/target_disk); \
debconf-set partman-auto/disk $TARGET_DISK; \
debconf-set grub-installer/bootdev $TARGET_DISK;

# 全自动磁盘策略，无需手动选盘
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select boot-root
d-i partman-auto/device_choice select automatic
# 自动跳过分区向导选择界面
d-i partman/choose_partition select finish

# 全盘清空、分区写入全部自动确认
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/erase_disk boolean true
d-i partman/erase_partitions boolean true
d-i partman/clear_disk boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/init boolean false
d-i partman-efi/confirm boolean true
d-i partman-efi/no_esp_warning boolean true
d-i partman/confirm_write_new_label true
d-i partman/confirm_clear_disk true

# Root管理员账号
d-i passwd/root-login boolean true
d-i passwd/root-password password 1
d-i passwd/root-password-again password 1
d-i passwd/make-user boolean false

# 预装软件包
tasksel tasksel/first multiselect standard
tasksel tasksel/desktop multiselect standard
tasksel tasksel/skip-tasks boolean true
d-i pkgsel/include string openssh-server sudo curl
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select none
d-i pkgsel/install-language-support boolean false

# GRUB自动跟随最小磁盘，移除强制sda的default配置
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/confirm boolean true
d-i grub-installer/efi_confirm boolean true
d-i grub-installer/efi_remove_other boolean true
d-i grub-installer/mbr_confirm boolean true

# 后置脚本：分开755赋权，无多余尾部\，移除--now
d-i preseed/late_command string \
cp /cdrom/extra/netcfg /target/usr/local/bin/netcfg; \
cp /cdrom/extra/init.sh /target/root/init.sh; \
in-target chmod 755 /usr/local/bin/netcfg; \
in-target chmod 755 /root/init.sh; \
in-target systemctl enable ssh;

# 安装结束仅重启，关闭关机/断电分支
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false
d-i debian-installer/exit/hard_disable_apt boolean true